name: Copilot Setup Steps
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/copilot-setup-steps.yml'
      - 'src/requirements.txt'
jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: src/requirements.txt
      - name: Install Python dependencies
        run: |
          python -m pip install -r src/requirements.txt
      - name: Verify database readiness
        run: python -c "from pymongo import MongoClient; assert MongoClient('mongodb://localhost:27017/', serverSelectionTimeoutMS=5000).admin.command('ping')['ok'] == 1"
      - name: Check backend syntax
        run: python -m compileall -q src
